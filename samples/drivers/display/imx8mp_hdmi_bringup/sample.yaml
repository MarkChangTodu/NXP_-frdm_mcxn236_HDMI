sample:
  name: i.MX8MP HDMI bring-up test (Main Goal 1.1-1.4)
  description: |
    Verifies that the i.MX8MP HDMI driver init code can power up the HDMIMIX
    and HDMI_PHY power domains via GPC (1.1), map the HDMI BLK_CTRL / HTX_PVI
    / HDMI TX / HDMI PHY MMIO windows (1.2), ungate the BLK_CTRL clocks (1.3)
    and deassert the per-block resets (1.4), and finally read back the
    documented reset values from the HDMIMIX slaves. Corresponds to plan
    sub-goals 1.1 through 1.4 in docs/plans/hdmi_driver_plan.md.
tests:
  sample.drivers.display.imx8mp_hdmi_bringup:
    build_only: true
    tags:
      - display
      - hdmi
    platform_allow:
      - imx8mp_evk/mimx8ml8/a53
    integration_platforms:
      - imx8mp_evk/mimx8ml8/a53
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "GPC power-up acknowledged"
        - "BLK_CTRL TX_CONTROL0 = 0x000000(18|19)"
        - "HDMI_PHY_REG1   = 0xd1"
        - "imx8mp_hdmi: probe ok"
        - "HDMI bring-up test: starting"
        - "Device is_ready\\(\\)  : YES"
        - "TEST 1.1-1.4 PASS"
