# i.MX8MP HDMI bring-up test — Main Goal 1.1 + 1.2
# Plan: docs/plans/hdmi_driver_plan.md

CONFIG_DISPLAY=y
CONFIG_IMX8MP_HDMI=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

CONFIG_MAIN_STACK_SIZE=4096

# Driver dynamically maps 5 device regions (GPC + 4 HDMI windows). Default
# MAX_XLAT_TABLES=8 is too small once SoC's static mappings also consume
# entries — observed "CONFIG_MAX_XLAT_TABLES is too small" panic at boot.
CONFIG_MAX_XLAT_TABLES=24
